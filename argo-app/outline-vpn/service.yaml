apiVersion: v1
kind: Service
metadata:
  name: outline-vpn
  namespace: outline-system
spec:
  type: NodePort
  selector:
    app: outline-vpn
  ports:
    - name: access-legacy-tcp
      port: 30400
      protocol: TCP
      targetPort: 30400
      nodePort: 30400
    - name: access-legacy-udp
      port: 30401
      protocol: UDP
      targetPort: 30400
      nodePort: 30400
    - name: access-tcp
      port: 30443
      protocol: TCP
      targetPort: 30443
      nodePort: 30443
    - name: access-udp
      port: 30444
      protocol: UDP
      targetPort: 30443
      nodePort: 30443
    - name: mgmt-tcp
      port: 60000
      protocol: TCP
      targetPort: 60000
      nodePort: 30600